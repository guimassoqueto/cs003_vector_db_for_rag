[project]
name = "cs003-vector-db-for-rag"
version = "0.1.0"
description = "Vector Databases for RAG: course notes and runnable lesson scripts"
requires-python = ">=3.14"
dependencies = [
    "chromadb",
    "numpy",
    "python-dotenv",
    "scipy",
    "sentence-transformers",
    "torch",
]

[dependency-groups]
dev = [
    "commitizen",
    "ipykernel",
    "pre-commit",
    "ruff",
    "scipy-stubs",
]

[tool.uv]
# asdf owns Python (.tool-versions): use only interpreters found on PATH, never
# download or pick a uv-managed one.
python-preference = "only-system"

# CPU-only torch: the default PyPI build pulls ~4 GB of CUDA libraries, and this
# machine has no NVIDIA GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
# Markdown is documentation, not source: ruff >= 0.14 formats the Python code
# blocks inside .md files, which rewrites hand-aligned snippets in the docs.
# Notebooks are left as written too: ruff lints and formats .ipynb cells by default
# (.ipynb is the only notebook format it reads).
# extend-exclude (not exclude) keeps ruff's own default exclusions in place.
extend-exclude = ["*.md", "*.ipynb", "devtools"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
